<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistline | Yeni Karargaha Geçiş</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020617;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        /* UZAY/HIZ EFEKTİ ARKA PLAN */
        .stars {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(2px 2px at 20px 30px, #e2e8f0, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #cbd5e1, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: warpSpeed 4s linear infinite;
            opacity: 0.3;
            z-index: 1;
        }

        @keyframes warpSpeed {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(200px) scale(1.5); opacity: 0; }
        }

        /* ANA KART */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(15, 23, 42, 0.7);
            padding: 60px 40px;
            border-radius: 30px;
            border: 1px solid rgba(14, 165, 233, 0.3);
            box-shadow: 0 0 50px rgba(14, 165, 233, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.5s ease;
        }

        /* LOGO */
        .logo {
            max-width: 300px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.2));
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: brightness(0) invert(1) drop-shadow(0 0 10px rgba(255,255,255,0.3));
        }

        .title {
            color: #f8fafc;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 40px;
            letter-spacing: 1px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .title span {
            color: #38bdf8;
            font-weight: 900;
        }

        /* NEFES ALAN ŞİŞEN BUTON */
        .hyper-btn {
            position: relative;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 900;
            padding: 20px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.4), inset 0 0 0 2px rgba(255,255,255,0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
            overflow: hidden;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.7); }
            70% { box-shadow: 0 0 0 25px rgba(14, 165, 233, 0); }
            100% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0); }
        }

        /* ÜZERİNE GELİNCE ŞİŞME EFEKTİ */
        .hyper-btn:hover {
            transform: scale(1.15) translateY(-5px);
            background: linear-gradient(135deg, #38bdf8, #1d4ed8);
            box-shadow: 0 20px 40px rgba(14, 165, 233, 0.6), inset 0 0 0 2px rgba(255,255,255,0.4);
            animation: none; 
        }

        .hyper-btn:active {
            transform: scale(0.9);
        }

        /* BUTON PARÇACIKLARI (PATLAMA İÇİN) */
        .particle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 20px #0ea5e9, 0 0 40px #fff;
            pointer-events: none;
            z-index: 100;
            animation: explode 0.8s cubic-bezier(0, 1, 1, 1) forwards;
        }

        @keyframes explode {
            0% { 
                transform: translate(0, 0) scale(1.5); 
                opacity: 1; 
            }
            100% { 
                transform: translate(var(--tx), var(--ty)) scale(0); 
                opacity: 0; 
            }
        }

        /* EKRAN BEYAZLAMA EFEKTİ (IŞINLANMA) */
        #flash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

    </style>
</head>
<body>

    <!-- Uzay arka planı -->
    <div class="stars"></div>
    <div class="stars" style="animation-delay: -2s; transform: rotate(90deg);"></div>

    <!-- Işınlanma flaşı -->
    <div id="flash"></div>

    <div class="container" id="main-container">
        <!-- Logomuz -->
        <img src="asissstlinelogo.png" alt="Assistline Logo" class="logo" id="logo" onerror="this.src='https://via.placeholder.com/300x80/0f172a/ffffff?text=ASSISTLINE';">
        
        <h2 class="title" id="title">Sistemimiz Yeni Bulut Karargahına <span>Taşındı!</span></h2>
        
        <!-- Efsane Buton -->
        <button class="hyper-btn" id="redirect-btn">YENİ SİSTEME GEÇİŞ YAP 🚀</button>
    </div>

    <script>
        const btn = document.getElementById('redirect-btn');
        const container = document.getElementById('main-container');
        const logo = document.getElementById('logo');
        const title = document.getElementById('title');
        const flash = document.getElementById('flash');

        btn.addEventListener('click', function(e) {
            // 1. Patlama Efekti Koordinatlarını Al
            const rect = btn.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            // 2. Parçacıkları Yarat (70 Adet Siber Mavi Şarapnel)
            for (let i = 0; i < 70; i++) {
                let particle = document.createElement('div');
                particle.className = 'particle';
                document.body.appendChild(particle);

                // Rastgele yön ve hız
                let angle = Math.random() * Math.PI * 2;
                let velocity = Math.random() * 300 + 100; // Ne kadar uzağa uçacakları
                let tx = Math.cos(angle) * velocity;
                let ty = Math.sin(angle) * velocity;

                // Parçacığı butonun ortasına koy ve hedef koordinatları ver
                particle.style.left = centerX + 'px';
                particle.style.top = centerY + 'px';
                particle.style.setProperty('--tx', `${tx}px`);
                particle.style.setProperty('--ty', `${ty}px`);
                
                // Rastgele renk tonları
                if(Math.random() > 0.5) particle.style.background = "#fff";

                // Animasyon bitince temizle
                setTimeout(() => particle.remove(), 800);
            }

            // 3. Butonu ve Ekranı Gizle (Görsel Şov)
            btn.style.transform = 'scale(0)';
            btn.style.opacity = '0';
            
            logo.style.transform = 'scale(1.5) translateY(-50px)';
            logo.style.opacity = '0';
            
            title.style.transform = 'scale(1.2)';
            title.style.opacity = '0';
            
            container.style.background = 'transparent';
            container.style.boxShadow = 'none';
            container.style.borderColor = 'transparent';

            // 4. Işınlanma Flaşını Çak
            setTimeout(() => {
                flash.style.opacity = '1';
            }, 300);

            // 5. YENİ SİSTEME IŞINLANMA (0.8 Saniye sonra)
            setTimeout(() => {
                window.location.href = "https://assistai-c145c.web.app/";
            }, 800);
        });
    </script>
</body>
</html>
